<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1e38 50%, #0d1117 100%);
            color: #fff;
        }

        .calculator {
            width: 340px;
            padding: 24px;
            background: rgba(26, 31, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
            backdrop-filter: blur(16px);
        }

        #display {
            width: 100%;
            height: 76px;
            margin-bottom: 20px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: #0b0f19;
            color: #38bdf8;
            font-family: 'Space Grotesk', monospace;
            font-size: 32px;
            font-weight: 700;
            text-align: right;
            outline: none;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            background: #252d43;
            color: #f1f5f9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        button:hover {
            background: #333d5c;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: scale(0.95) translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Utility buttons (Back, %) */
        .btn-func {
            background: #3b4563;
            color: #94a3b8;
        }

        .btn-func:hover {
            background: #485479;
            color: #e2e8f0;
        }

        /* Clear button */
        .clear {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);

        /* Operator buttons */
        .operator {

        .equal {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);

            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);

</head>

<body>

    <div class="calculator">

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="btn-func" onclick="deleteLast()">⌫</button>
            <button class="btn-func" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                let expression = display.value;

                // Convert percentage
                expression = expression.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");

                // Basic validation
                if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
                    display.value = "Error";
                    return;
                }

                // Calculate the expression
                display.value = Function(
                    '"use strict"; return (' + expression + ')'
                )();

            } catch (error) {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
