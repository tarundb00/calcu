<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin | Everyday Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #24201b;
            --muted: #81786d;
            --paper: #f5f0e8;
            --panel: #fffdf9;
            --line: #e6ded3;
            --coral: #e76f51;
            --sage: #dce8dc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            background: var(--paper);
            color: var(--ink);
            background-image: radial-gradient(#d8cfc2 1px, transparent 1px), linear-gradient(120deg, rgba(255,255,255,.65), transparent 55%);
            background-size: 22px 22px, 100% 100%;
        }

        .calculator {
            width: min(100%, 420px);
            padding: 30px;
            background: var(--panel);
            border: 1px solid rgba(36, 32, 27, .08);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(73, 57, 38, .14);
            animation: arrive .55s ease-out both;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .topbar, .history-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-weight: 800;

        .brand-mark {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--coral);
            color: white;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .12em;

            font-weight: 800;

            min-height: 142px;

            flex-direction: column;

            width: 100%;

    </style>
</head>

<body>

    <div class="calculator">
        <div class="topbar">
            <div class="brand"><span class="brand-mark">+</span><span>Margin</span></div>
            <span class="eyebrow">Everyday math</span>
        </div>

        <div class="screen">
            <input type="text" id="expression" aria-label="Current expression" readonly>
            <input type="text" id="display" value="0" aria-label="Calculator result" readonly>
        </div>

        <div class="history-row">
            <span id="history">Ready when you are</span>
            <button id="clear-history" type="button" onclick="clearHistory()">Clear history</button>
        </div>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="btn-func" onclick="deleteLast()">⌫</button>
            <button class="btn-func" onclick="appendValue('%')">%</button>
            <button class="btn-func" onclick="squareNumber()">x²</button>
            <button class="btn-func" onclick="squareRootNumber()">√</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        const expressionDisplay = document.getElementById("expression");
        const historyDisplay = document.getElementById("history");
        let justCalculated = false;

        function appendValue(value) {
            if (display.value === "Error" || display.value === "0" || (justCalculated && /\d|\./.test(value))) display.value = "";
            justCalculated = false;
            display.value += value;
        }

        function clearDisplay() {
            display.value = "0";
            expressionDisplay.value = "";
            historyDisplay.textContent = "Ready when you are";
            justCalculated = false;
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function squareNumber() {
            const number = Number(display.value);

            if (!display.value || !Number.isFinite(number)) {
                display.value = "Error";
                return;
            }

            display.value = number ** 2;
        }

        function squareRootNumber() {
            const number = Number(display.value);

            if (!display.value || !Number.isFinite(number) || number < 0) {
                display.value = "Error";
                return;
            }

            display.value = Math.sqrt(number);
        }

        function calculate() {
            try {
                const original = display.value;
                let expression = original;

                if (!expression || expression === "0") return;

                // Convert percentage
                expression = expression.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");

                // Basic validation
                if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
                    display.value = "Error";
                    return;
                }

                const result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (!Number.isFinite(result)) throw new Error("Invalid result");
                expressionDisplay.value = original;
                display.value = String(Number(result.toFixed(10)));
                historyDisplay.textContent = `${original} = ${display.value}`;
                justCalculated = true;

            } catch (error) {
                display.value = "Error";
                expressionDisplay.value = "Check that expression";
                justCalculated = false;
            }
        }

        function clearHistory() {
            historyDisplay.textContent = "Ready when you are";
        }

        document.addEventListener("keydown", (event) => {
            if (/^[0-9+\-*/().%]$/.test(event.key)) appendValue(event.key);
            if (event.key === "Enter" || event.key === "=") calculate();
            if (event.key === "Backspace") deleteLast();
            if (event.key === "Escape") clearDisplay();
        });
    </script>

</body>
</html>
